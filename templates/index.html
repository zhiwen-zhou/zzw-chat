<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>ZZW Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        #chat {
            width: 600px;
            height: 400px;
            border: 1px solid #ddd;
            padding: 10px;
            background: white;
            overflow-y: auto;
        }
        .user { color: #1677ff; margin-bottom: 8px; }
        .ai { color: #333; margin-bottom: 8px; }
        #input {
            width: 70%;
            padding: 8px;
        }
        button {
            padding: 8px 16px;
        }
    </style>
</head>
<body>

<h2>ZZW Chat（DeepSeek-R1）</h2>

<div id="chat"></div>

<br>

<input id="input" placeholder="输入你的问题..." />
<button onclick="send()">发送</button>

<script>
async function send() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const msg = input.value.trim();
    if (!msg) return;

    chat.innerHTML += `<div class="user">你：${msg}</div>`;
    input.value = "";

    const aiDiv = document.createElement("div");
    aiDiv.className = "ai";
    aiDiv.textContent = "AI：";
    chat.appendChild(aiDiv);

    const response = await fetch("/chat/stream", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");

    while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split("\n");

        for (const line of lines) {
            if (line.startsWith("data:")) {
                const data = line.replace("data:", "").trim();
                if (data === "[DONE]") continue;
                try {
                    const json = JSON.parse(data);
                    const content = json.choices?.[0]?.delta?.content || "";
                    aiDiv.textContent += content;
                } catch {}
            }
        }
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
