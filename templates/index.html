<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>My Chat</title>
<style>
    body { font-family: sans-serif; padding: 20px; }
    #chat { border:1px solid #ccc; height:350px; overflow-y:auto; padding:10px; }
    .user { color:#1677ff; margin-bottom:6px; }
    .ai { color:#333; margin-bottom:6px; }
    #input { width:70%; padding:8px; }
</style>
</head>
<body>

<h2>My Chat</h2>

<div id="chat"></div>

<br>

<input id="input" placeholder="输入消息，回车发送">
<button onclick="send()">发送</button>
<button onclick="stop()">停止生成</button>

<script>
let abort = false;
let history = [];

function appendMessage(role, text) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = role;
    div.textContent = (role === "user" ? "你：" : "AI：") + text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const input = document.getElementById("input");
    const msg = input.value.trim();
    if (!msg) return;

    abort = false;
    input.value = "";
    appendMessage("user", msg);

    history.push({role: "user", content: msg});

    const aiDiv = document.createElement("div");
    aiDiv.className = "ai";
    aiDiv.textContent = "AI：";
    document.getElementById("chat").appendChild(aiDiv);

    const resp = await fetch("/chat/stream", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({messages: history})
    });

    const data = await resp.json();
    const text = data.content || "";

    for (let i = 0; i < text.length; i++) {
        if (abort) break;
        await new Promise(r => setTimeout(r, 25));
        aiDiv.textContent += text[i];
    }

    if (!abort) {
        history.push({role: "assistant", content: text});
    }
}

function stop() {
    abort = true;
}

// ✅ 回车发送
document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
</script>

</body>
</html>
